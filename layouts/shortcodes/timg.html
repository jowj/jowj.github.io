{{/* width/height let the browser reserve the image's space before it lazy-loads,
     so the page doesn't shift as you scroll past. Only possible when src is an
     image in the page bundle. */}}
{{ $src := .Get "src" }}
{{ $img := .Page.Resources.Get $src }}
<figure class="timg">
  <a href="{{ $src }}" target="_blank" rel="noopener">
    <img src="{{ $src }}" alt="{{ .Get "alt" }}" loading="lazy"{{ with $img }}{{ if eq .ResourceType "image" }} width="{{ .Width }}" height="{{ .Height }}"{{ end }}{{ end }} />
  </a>
  {{ with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
